<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>かんたん給料計算</title>

<style>

body{font-family:sans-serif;background:#f2f5fa;margin:0;padding:20px;color:#222}

main{max-width:480px;margin:auto;background:white;padding:22px;border-radius:18px;box-shadow:0 4px 18px #0001}

h1{text-align:center;font-size:25px}

p{color:#666;font-size:13px}

label{display:block;margin-top:16px;font-weight:bold}

input,select{box-sizing:border-box;width:100%;padding:13px;margin-top:6px;border:1px solid #ccc;border-radius:9px;font-size:17px}

button{width:100%;padding:15px;border:0;border-radius:10px;background:#2463eb;color:white;font-size:17px;font-weight:bold;margin-top:20px}

.result{background:#eaf2ff;padding:18px;border-radius:12px;margin-top:20px}

.money{font-size:30px;font-weight:bold;color:#174fc2;overflow-wrap:anywhere}

</style>

</head>

<body>

<main>

<h1>💰 かんたん給料計算</h1>

<p>月給・時給どちらにも対応！残業代も計算できます。</p>

<label>給料の種類</label>

<select id="type" onchange="changeType()">

<option value="monthly">月給制</option>

<option value="hourly">時給制</option>

</select>

<label id="payLabel">基本月給（円）</label>

<input id="pay" type="number" placeholder="例：250000">

<label>毎月の手当（円）</label>

<input id="allowance" type="number" value="0">

<label>月の所定労働時間</label>

<input id="hours" type="number" value="160">

<label>残業時間（時間）</label>

<input id="overtime" type="number" value="0">

<label>残業の割増率</label>

<select id="rate">

<option value="1.25">25%増（1.25倍）</option>

<option value="1.35">35%増（1.35倍）</option>

<option value="1.5">50%増（1.5倍）</option>

</select>

<label>深夜労働時間（22時〜翌5時）</label>

<input id="night" type="number" value="0">

<button onclick="calculate()">給料を計算する</button>

<div class="result">

<p>基本給＋手当</p>

<div id="base">0円</div>

<p>残業代（概算）</p>

<div id="over">0円</div>

<p>深夜割増分（概算）</p>

<div id="nightPay">0円</div>

<hr>

<p>月の支給額（税金・社会保険料控除前）</p>

<div class="money" id="total">0円</div>

</div>

<p>※概算です。実際の給与は会社の計算方法、各種手当、法定割増率などで変わります。深夜時間と残業時間が重なる場合、深夜割増分を別途加算します。</p>

</main>

<script>

function yen(n){return Math.round(n).toLocaleString('ja-JP')+'円'}

function changeType(){

 document.getElementById('payLabel').textContent=

 document.getElementById('type').value==='monthly'?'基本月給（円）':'時給（円）';

}

function calculate(){

 const type=document.getElementById('type').value;

 const pay=Number(document.getElementById('pay').value)||0;

 const allowance=Number(document.getElementById('allowance').value)||0;

 const hours=Number(document.getElementById('hours').value)||0;

 const ot=Number(document.getElementById('overtime').value)||0;

 const night=Number(document.getElementById('night').value)||0;

 const rate=Number(document.getElementById('rate').value)||1.25;

 const hourly=type==='monthly'?(hours>0?pay/hours:0):pay;

 const base=type==='monthly'?pay+allowance:pay*hours+allowance;

 const over=hourly*ot*rate;

 const nightExtra=hourly*night*0.25;

 document.getElementById('base').textContent=yen(base);

 document.getElementById('over').textContent=yen(over);

 document.getElementById('nightPay').textContent=yen(nightExtra);

 document.getElementById('total').textContent=yen(base+over+nightExtra);

}

</script>


<p style="text-align:center;margin:24px 0">
  <a href="guide.html">給料計算の使い方・計算方法</a>
</p>

</body>

</html>
